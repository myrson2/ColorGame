<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Game UI</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="game-container">
        <div class="header">
          <h1 class="logo">COLORGAME</h1>
          <button class="settings-btn">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="24px"
              viewBox="0 -960 960 960"
              width="24px"
              fill="black"
            >
              <path
                d="m370-80-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-2 13.5l103 78-110 190-118-50q-11 8-23 15t-24 12L590-80H370Zm70-80h79l14-106q31-8 57.5-23.5T639-327l99 41 39-68-86-65q5-14 7-29.5t2-31.5q0-16-2-31.5t-7-29.5l86-65-39-68-99 42q-22-23-48.5-38.5T533-694l-13-106h-79l-14 106q-31 8-57.5 23.5T321-633l-99-41-39 68 86 64q-5 15-7 30t-2 32q0 16 2 31t7 30l-86 65 39 68 99-42q22 23 48.5 38.5T427-266l13 106Zm42-180q58 0 99-41t41-99q0-58-41-99t-99-41q-59 0-99.5 41T342-480q0 58 40.5 99t99.5 41Zm-2-140Z"
              />
            </svg>
          </button>
        </div>

        <div class="reels-container">
          <div class="reel-1 yellow"></div>
          <div class="reel-2 purple"></div>
          <div class="reel-3 green"></div>
        </div>
        <div class="bet-section">
          <div class="bet-header">
            <span>Place Bet</span>
            <hr />
          </div>

          <div class="bet-grid">
            <button
              class="bet-tile red"
              data-betRed="0"
              data-color="red"
            ></button>
            <button
              class="bet-tile green"
              data-betGreen="0"
              data-color="green"
            ></button>
            <button
              class="bet-tile purple"
              data-betPurple="0"
              data-color="purple"
            ></button>
            <button
              class="bet-tile yellow"
              data-betYellow="0"
              data-color="yellow"
            ></button>
            <button
              class="bet-tile blue"
              data-betBlue="0"
              data-color="blue"
            ></button>
            <button
              class="bet-tile pink"
              data-betPink="0"
              data-color="pink"
            ></button>
          </div>
        </div>

        <div class="footer">
          <div class="info-group">
            <span class="label">Balance</span>
            <span class="balance-value">00</span>
          </div>
          <div class="info-group play-button">
            <button type="button" class="roll-btn">
              <span class="roll-btn__idle">Roll It!</span>
            </button>
          </div>

          <div class="info-group rolling-btn">
            <button class="roll-btn__loading">
              <span class="loader" aria-hidden="true"></span>
              Rolling...
            </button>
          </div>

          <div class="info-group align-right">
            <span class="label">Total Bet</span>
            <span class="bet-value">00</span>
          </div>
        </div>
      </div>
    </main>

    <section class="menu-card">
      <div class="menu">
        <div class="menu-container">
          <div class="input-balance">
            <h1>Set Bet</h1>
            <input type="number" placeholder="Balance" />
          </div>
          <div class="input-bet">
            <div class="bet-tiles-header">
              <span>Bet Tiles</span>
              <hr />
            </div>
            <div class="bet-tiles-grid">
              <button class="bet red" data-value="5">05</button>
              <button class="bet pink" data-value="10">10</button>
              <button class="bet purple" data-value="50">50</button>
              <button class="bet yellow" data-value="100">100</button>
            </div>
          </div>
          <div class="input-play">
            <button class="save-btn">Save & Play</button>
          </div>
        </div>
      </div>
    </section>

    <section id="resultModal" class="modal-overlay">
      <div class="result-card">
          <h1 class="result-title">Result: <span id="resultColors"></span></h1>
  
          <div class="summary-container">
              <div class="bet-details">
                  <h3>Your Bet</h3>
                  <div class="table-header">
                      <span>Color</span>
                      <span>Bet</span>
                      <span>Win/Lose</span>
                  </div>
                  <div id="betTableBody">
                      </div>
              </div>
  
              <div class="total-box">
                  <h3>Total</h3>
                  <div id="finalPayout" class="grand-amount">₱0</div>
              </div>
          </div>
  
          <div class="modal-actions">
              <button onclick="closeModal()" class="btn-again">Bet Again</button>
              <button onclick="cashout()" class="btn-cashout">Cashout</button>
          </div>
      </div>
  </section>
    <script src="script.js"></script>
  </body>
</html>
